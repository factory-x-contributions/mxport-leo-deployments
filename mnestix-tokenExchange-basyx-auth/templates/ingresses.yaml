{{- if and .Values.mnestixBrowser.enabled .Values.mnestixBrowser.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mnestix-tokenexchange-basyx-auth.componentName" (dict "root" . "component" "mnestix-browser") }}
  labels:
    {{- include "mnestix-tokenexchange-basyx-auth.labels" (dict "root" . "component" "mnestix-browser") | nindent 4 }}
  {{- with .Values.mnestixBrowser.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.mnestixBrowser.ingress.className }}
  ingressClassName: {{ .Values.mnestixBrowser.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.mnestixBrowser.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "mnestix-tokenexchange-basyx-auth.componentName" (dict "root" $ "component" "mnestix-browser") }}
                port:
                  number: {{ $.Values.mnestixBrowser.service.port }}
          {{- end }}
    {{- end }}
  {{- with .Values.mnestixBrowser.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
