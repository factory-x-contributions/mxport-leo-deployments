networks:
  mnestix-network:

volumes:
  mnestix-database:
  mnestix-mongodb-data:

services:
  mnestix-browser:
    image: mnestix/mnestix-browser:2.0.0
    ports:
      - '3000:3000'
    depends_on:
      mnestix-proxy:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DISCOVERY_API_URL: 'http://mnestix-proxy:5065/discovery'
      AAS_REPO_API_URL: 'http://mnestix-proxy:5065/plugfest5'
      SUBMODEL_REPO_API_URL: 'http://mnestix-proxy:5065/plugfest5'
      CONCEPT_DESCRIPTION_REPO_API_URL: 'http://mnestix-proxy:5065/plugfest5'
      SERIALIZATION_API_URL: 'http://mnestix-proxy:5065/plugfest5'
      MNESTIX_AAS_GENERATOR_API_URL: 'http://mnestix-proxy:5065'

      MNESTIX_BACKEND_API_KEY: ${MNESTIX_BACKEND_API_KEY:-verySecureApiKey}
      AAS_LIST_FEATURE_FLAG: 'true'
      TRANSFER_FEATURE_FLAG: 'false'
      COMPARISON_FEATURE_FLAG: 'true'
      PRODUCT_VIEW_FEATURE_FLAG: 'false'
      AUTHENTICATION_FEATURE_FLAG: 'true'
      NEXTAUTH_URL: 'http://localhost:3000'
      KEYCLOAK_ENABLED: 'true'
      KEYCLOAK_CLIENT_ID: 'mnestix-browser-client-demo'
      KEYCLOAK_ISSUER: 'http://keycloak:8080'
      KEYCLOAK_LOCAL_URL: 'http://localhost:8080'
      KEYCLOAK_REALM: 'Mnestix'
      LOCK_TIMESERIES_PERIOD_FEATURE_FLAG: 'true'
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-verySecureNextAuthSecret}
      SECRET_ENC_KEY: ${SECRET_ENC_KEY:-J+mMxwKo+aoFJ6uxMv6Acv54buuBir2EJ3z6LGFB+Vo=}
      IMPRINT_URL: ''
      DATA_PRIVACY_URL: ''
      BASYX_RBAC_ENABLED: 'false'
    networks:
      - mnestix-network
    volumes:
      - mnestix-database:/app/prisma/database

  mnestix-proxy:
    image: mnestix/mnestix-proxy:1.0.0-fx
    ports:
      - '5065:5065'
    depends_on:
      keycloak:
        condition: service_started
    environment:
      # API key authorization
      CustomerEndpointsSecurity__ApiKey: ${MNESTIX_BACKEND_API_KEY:-verySecureApiKey}
      # AzureAd
      AzureAd__EnableAzureAdAuth: "false"
      # OpenID Configuration
      OpenId__EnableOpenIdAuth: "true"
      OpenId__Issuer: "https://keycloak:8443/realms/Mnestix"
      OpenId__ClientID: "mnestixApi-demo"
      OpenId__RequireHttpsMetadata: "false"
      # ASP.NET Core URLs
      ASPNETCORE_URLS: "http://+:5065"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5065'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mnestix-network

  keycloak:
    build:
      context: ./keycloak
    volumes:
      - ./keycloak/realm:/opt/jboss/keycloak/imports
      - ./keycloak/certs:/opt/keycloak/conf
    ports:
      - 8080:8080
      - 8443:8443
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_SPI_INITIALIZER_ISSUER_BASE_URI: https://keycloak:8443
      KC_HEALTH_ENABLED: 'true'
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
      KC_HTTP_ENABLED: 'true'
    command: ['start-dev', '--import-realm']
    networks:
      - mnestix-network

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoAdmin
      MONGO_INITDB_ROOT_PASSWORD: mongoPassword
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 3s
      timeout: 3s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-file: '5'
        max-size: '100m'
    networks:
      - mnestix-network

  aas-environment:
    image: eclipsebasyx/aas-environment:2.0.0-milestone-06
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # MongoDb configuration for Basyx Repository
      BASYX__BACKEND: MongoDB
      SPRING__DATA__MONGODB__HOST: mongodb
      SPRING__DATA__MONGODB__DATABASE: basyxdb
      SPRING__DATA__MONGODB__authentication-database: admin
      SPRING__DATA__MONGODB__USERNAME: mongoAdmin
      SPRING__DATA__MONGODB__PASSWORD: mongoPassword
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 100000KB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100000KB
      # Allow mnestix frontend and backend to call basyx
      BASYX_CORS_ALLOWED-ORIGINS: '*'
      BASYX_CORS_ALLOWED-METHODS: GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
    healthcheck:
      test: curl -f http://localhost:8081/actuator/health
      interval: 10s
      timeout: 10s
      retries: 6
    logging:
      driver: 'json-file'
      options:
        max-file: '5'
        max-size: '100m'
    networks:
      - mnestix-network
