{{- if .Values.mnestixBrowser.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mnestix-tokenexchange-basyx-auth.componentName" (dict "root" . "component" "mnestix-browser") }}
  labels:
    {{- include "mnestix-tokenexchange-basyx-auth.labels" (dict "root" . "component" "mnestix-browser") | nindent 4 }}
spec:
  type: {{ .Values.mnestixBrowser.service.type }}
  selector:
    {{- include "mnestix-tokenexchange-basyx-auth.selectorLabels" (dict "root" . "component" "mnestix-browser") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mnestixBrowser.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
