{{- if .Values.keycloak.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mnestix-tokenexchange-basyx-auth.componentName" (dict "root" . "component" "keycloak") }}
  labels:
    {{- include "mnestix-tokenexchange-basyx-auth.labels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  type: {{ .Values.keycloak.service.type }}
  selector:
    {{- include "mnestix-tokenexchange-basyx-auth.selectorLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.keycloak.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: https
      port: {{ .Values.keycloak.service.httpsPort }}
      targetPort: https
      protocol: TCP
{{- end }}
