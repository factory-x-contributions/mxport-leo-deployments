faaast-registry:
  fullnameOverride: "fx-leo-faaast-registry"
  image:
    repository: docker.io/fraunhoferiosb/faaast-registry
    tag: 1.2.0-SNAPSHOT
    pullPolicy: Always
  ingress:
    enabled: true
    className: "nginx"
    tls:
      - hosts:
          - fa3st-registry.factory-x.catena-x.net
        secretName: fx-leo-faaast-registry-tls
    hosts:
      - host: fa3st-registry.factory-x.catena-x.net
        paths:
          - path: /
            pathType: Prefix
    basicAuth:
      enabled: false

  # possible: q, v, vv, vvv
  # Important: Don't prefix a dash ("-")
  # logLevel: v

  server:
    port: 8090
    ssl:
      enabled: false

  persistence:
    sql:
      hibernate:
        # Recommended for first start of database: Creates schema
        ddlAuto: update
      datasource:
        external:
          enabled: false

faaast-service:
  fullnameOverride: "fx-leo-faaast-service"
  image:
    repository: ghcr.io/factory-x-contributions/fa3st-service
    tag: fxleo
    pullPolicy: Always

  registry:
    aasRegistryBaseUrl: "http://fx-leo-faaast-registry:443"
    submodelRegistryBaseUrl: "http://fx-leo-faaast-registry:443"

  # Optional: add auth header for registry synchronization requests (e.g. Basic auth for ingress-protected registry)
  registrySynchronization:
    auth:
      header:
        name: ""
        value: ""

  persistence:
    host: "mongodb"
    port: "27017"
    database: "faaast-database"
    username: <path:factory-x-ci-cd/data/blueprint-leo#mongodb-admin-user>
    password: <path:factory-x-ci-cd/data/blueprint-leo#mongodb-admin-pw>

  endpoints:
    - class: "de.fraunhofer.iosb.ilt.faaast.service.endpoint.http.HttpEndpoint"
      port: 8080
      hostname: "localhost"
      subprotocol: ""
      subprotocolBody: ""
      subprotocolBodyEncoding: plain
      corsEnabled: true
      sslEnabled: false
      security:
        enabled: true
        jwkProvider: "http://fx-leo-token-exchange-provider:9050/sts/jwks"

  messageBus:
    class: "de.fraunhofer.iosb.ilt.faaast.service.messagebus.internal.MessageBusInternal"

  ingress:
    enabled: true
    className: "nginx"
    tls:
      - hosts:
          - fa3st-service.factory-x.catena-x.net
        secretName: fx-leo-faaast-service-tls
    hosts:
      - host: fa3st-service.factory-x.catena-x.net
        paths:
          - path: /
            pathType: Prefix

  seeding:
    enabled: false

mxport-leo-token-exchange-provider:
  enabled: true
  fullnameOverride: "fx-leo-token-exchange-provider"
  replicaCount: 1
  image:
    repository: ghcr.io/factory-x-contributions/mxport-leo-token-exchange
    pullPolicy: Always
    tag: "latest"
  service:
    type: ClusterIP
    port: 9050
    targetPort: 9050
  signingKeySecret: <path:factory-x-ci-cd/data/blueprint-leo#token-exchange-provider-private-key>
  serverConfig: |
    serviceConfiguration:
      issuer: https://sts-provider.factory-x.catena-x.net/sts
      chooseFilterManagerBySubjectToken: true
      signingKeyAlias: demo-key
      tokenExchangeFilterConfigurationYml: filter-config/filter-config.yml
      plainkey:
        keyLocation: signingkey/private_key.pem
        keyId: demo-key
      outgoingTokenScopeClaimName: scope
      forceOverwriteIssuerWithConfiguredValue: false
      forceOverwriteIatWithNow: false
      forceNewJti: false
    issuerSpecificConfiguration:
      - issuer: https://keycloak.factory-x.catena-x.net/realms/fa3st-provider
        jwksValue: |
          <path:factory-x-ci-cd/data/blueprint-leo#token-exchange-provider-keycloak-jwks>
        connectionTimeoutInMs: 20000
        readTimeoutInMs: 20000
        tokenScopeClaimName: scope
        propagateIssuerToValidators: true
        disableSubjectTokenClaimsSetValidator: false
        subjectTokenClaimsSetValidator:
          issuerRequired: true
          requiredScopes:
            - exchange
          requiredAudiences:
            - sts-provider
          expiryClaimRequired: true
          expiryCheckDisabled: false
          nbfClaimRequired: false
          nbfCheckDisabled: false
          iatClaimRequired: false
          iatCheckDisabled: false
        actorTokenRequired: false
        actorTokenClaimsSetValidator:
          issuerRequired: true
          requiredScopes:
            - authentication
          requiredAudiences:
            - token

