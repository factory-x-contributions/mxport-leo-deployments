apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mxport-leo-token-exchange.fullname" . }}-server-config
data:
  server-config.yml: |
{{ .Values.serverConfig | default (.Files.Get "server-config.yaml") | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mxport-leo-token-exchange.fullname" . }}-filter-config
data:
  filter-config.yml: |
{{ .Values.filterConfig | default (.Files.Get "filter-config.yaml") | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mxport-leo-token-exchange.fullname" . }}-trusted-list
data:
  signed_example_trusted_list.xml: |
{{ .Files.Get "trusted-list/signed_example_trusted_list.xml" | indent 4 }}
  rsa_public.pem: |
{{ .Files.Get "trusted-list/rsa_public.pem" | indent 4 }}
