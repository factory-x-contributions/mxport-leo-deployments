replicaCount: 1

image:
  repository: ghcr.io/factory-x-contributions/mxport-leo-token-exchange
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: "{{ .Release.Name }}-mxport-leo-token-exchange-ghcr"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 9050
  targetPort: 9050

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

pod:
  selector: {}

env:
  SPRING_TOKEN_EXCHANGE_CONFIG_LOCATION: server-config/server-config.yml
  SERVER_PORT: "9050"
  SERVER_CONTEXT_PATH: /sts
  TRUSTED_LIST_ENABLE: "true"
  TRUSTED_LIST_LOCATION: trusted-list/signed_example_trusted_list.xml
  TRUSTED_LIST_SCHEMA: trusted-list/19612_xsd.xsd
  TRUSTED_LIST_PUBLIC_KEY: trusted-list/rsa_public.pem

# Override server-config.yml content (falls back to chart's server-config.yaml if empty)
serverConfig: ""

# Override filter-config.yml content (falls back to chart's filter-config.yaml if empty)
filterConfig: ""

# Vault path for the signing key private key
signingKeySecret: "<path:factory-x-ci-cd/data/blueprint-leo#token-exchange-private-key>"

volumeMounts:
  - name: server-config
    mountPath: /app/server-config
    readOnly: true
  - name: filter-config
    mountPath: /app/filter-config
    readOnly: true
  - name: signingkey
    mountPath: /app/signingkey
    readOnly: true
  - name: trusted-list
    mountPath: /app/trusted-list
    readOnly: true

volumes:
  - name: server-config
    configMap:
      name: "{{ .Release.Name }}-server-config"
  - name: filter-config
    configMap:
      name: "{{ .Release.Name }}-filter-config"
  - name: signingkey
    secret:
      secretName: "{{ .Release.Name }}-signing-key"
  - name: trusted-list
    configMap:
      name: "{{ .Release.Name }}-trusted-list"
