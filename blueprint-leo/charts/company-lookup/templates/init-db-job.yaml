{{- if and (not .Values.postgresql.enabled) .Values.initDb.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "company-lookup.fullname" . }}-init-db
  labels:
    {{- include "company-lookup.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "company-lookup.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: init-db
          image: "bitnamilegacy/postgresql:latest"
          command:
            - /bin/sh
            - -c
            - |
              PGHOST="{{ include "company-lookup.postgresqlHost" . }}"
              PGPORT="5432"
              PGUSER="{{ .Values.initDb.adminUser }}"
              PGPASSWORD="{{ .Values.initDb.adminPassword }}"
              CL_USER="{{ .Values.postgresql.auth.username }}"
              CL_PASS="{{ .Values.postgresql.auth.password }}"
              CL_DB="{{ .Values.postgresql.auth.database }}"

              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                echo "PostgreSQL not ready, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready. Running init SQL..."

              # Create user if not exists
              USER_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$CL_USER'")
              if [ "$USER_EXISTS" != "1" ]; then
                echo "Creating user $CL_USER..."
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -c "CREATE USER \"$CL_USER\" WITH PASSWORD '$CL_PASS';"
              else
                echo "User $CL_USER already exists, skipping."
              fi

              # Create database if not exists
              DB_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$CL_DB'")
              if [ "$DB_EXISTS" != "1" ]; then
                echo "Creating database $CL_DB..."
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -c "CREATE DATABASE \"$CL_DB\" OWNER \"$CL_USER\";"
              else
                echo "Database $CL_DB already exists, skipping."
              fi

              # Grant privileges
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE \"$CL_DB\" TO \"$CL_USER\";"

              echo "Database initialization complete."
{{- end }}
