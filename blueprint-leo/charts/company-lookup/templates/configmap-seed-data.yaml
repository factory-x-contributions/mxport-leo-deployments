            "language": "en",
            "text": "Fraunhofer Institute for Experimental Software Engineering IESE"
          }
        ],
        "administration": {
          "version": "1",
          "revision": "0",
          "creator": {
            "type": "ExternalReference",
            "keys": [
              {
                "type": "GlobalReference",
                "value": "https://iese.fraunhofer.de"
              }
            ]
          }
        },
        "endpoints": [
          {
            "protocolInformation": {
