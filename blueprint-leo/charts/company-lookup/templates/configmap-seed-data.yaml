{{- if .Values.seedData.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "company-lookup.fullname" . }}-seed-script
  labels:
    {{- include "company-lookup.labels" . | nindent 4 }}
data:
  seed.sh: |
    #!/bin/sh
    set -e

    COMPANY_LOOKUP_URL="http://{{ include "company-lookup.fullname" . }}:{{ .Values.service.port }}"

    echo "Waiting for Company Lookup to be ready..."
    max_attempts=60
    attempt=0

    while [ $attempt -lt $max_attempts ]; do
        if curl -fsS -o /dev/null "${COMPANY_LOOKUP_URL}/health"; then
            echo "Company Lookup is healthy!"
            break
        fi
        attempt=$((attempt + 1))
        echo "Attempt ${attempt}/${max_attempts} - Service not ready yet, waiting..."
        sleep 5
    done

    if [ $attempt -eq $max_attempts ]; then
        echo "Error: Company Lookup did not become healthy in time"
        exit 1
    fi

    sleep 2

    echo "Pre-filling Company Lookup with sample data..."

    post_company() {
        label=$1
        file=$2
        echo "Adding ${label}..."
        body=$(mktemp)
        status=$(curl -sS -o "${body}" -w "%{http_code}" -X POST "${COMPANY_LOOKUP_URL}/companies" \
            -H "Content-Type: application/json" \
            --data-binary @"${file}")
        echo "  HTTP ${status}"
        echo "  response: $(cat "${body}")"
        rm -f "${body}"
        if [ "${status}" -ge 400 ]; then
            echo "Error: POST ${label} failed with HTTP ${status}"
            return 1
        fi
    }

    post_company "Fraunhofer IESE" /data/fraunhofer-iese.json
    post_company "Example Company" /data/example-company.json

    echo "All sample data has been successfully added to Company Lookup!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "company-lookup.fullname" . }}-seed-data
  labels:
    {{- include "company-lookup.labels" . | nindent 4 }}
data:
  fraunhofer-iese.json: |
