apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "company-lookup.fullname" . }}
  labels:
    {{- include "company-lookup.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "company-lookup.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "company-lookup.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "company-lookup.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: "bitnamilegacy/postgresql:latest"
          command:
            - /bin/sh
            - -c
            - |
              PGHOST="{{ include "company-lookup.postgresqlHost" . }}"
              PGPORT="5432"
              PGUSER="{{ .Values.initDb.adminUser }}"
              PGPASSWORD="{{ .Values.initDb.adminPassword }}"
              CL_USER="{{ .Values.postgresql.auth.username }}"
              CL_PASS="{{ .Values.postgresql.auth.password }}"
              CL_DB="{{ .Values.postgresql.auth.database }}"

              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                echo "PostgreSQL not ready, waiting..."
                sleep 5
              done
              echo "PostgreSQL is ready."

              USER_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$CL_USER'")
              if [ "$USER_EXISTS" != "1" ]; then
                echo "Creating user $CL_USER..."
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -c "CREATE USER \"$CL_USER\" WITH PASSWORD '$CL_PASS';"
              else
                echo "User $CL_USER already exists, skipping."
              fi

              DB_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$CL_DB'")
              if [ "$DB_EXISTS" != "1" ]; then
                echo "Creating database $CL_DB..."
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -c "CREATE DATABASE \"$CL_DB\" OWNER \"$CL_USER\";"
              else
                echo "Database $CL_DB already exists, skipping."
              fi

              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE \"$CL_DB\" TO \"$CL_USER\";"

              echo "Database initialization complete."
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: CORS_ALLOWEDORIGINS
              value: {{ .Values.cors.allowedOrigins | quote }}
            - name: CORS_ALLOWEDHEADERS
              value: {{ .Values.cors.allowedHeaders | quote }}
            - name: CORS_ALLOWEDCREDENTIALS
              value: {{ .Values.cors.allowedCredentials | quote }}
            - name: CORS_ALLOWEDMETHODS
              value: {{ .Values.cors.allowedMethods | quote }}
            - name: POSTGRES_HOST
              value: {{ include "company-lookup.postgresqlHost" . | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRES_DBNAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_MAXOPENCONNECTIONS
              value: "500"
            - name: POSTGRES_MAXIDLECONNECTIONS
              value: "500"
            - name: POSTGRES_CONNMAXLIFETIMEMINUTES
              value: "5"
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
