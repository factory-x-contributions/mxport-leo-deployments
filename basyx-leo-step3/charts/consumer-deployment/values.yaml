global:
  security:
    allowInsecureImages: true # needed because bitnami is now in bitnamilegacy

keycloak:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak
    tag: 26.3.3
  postgresql:
    enabled: true
    auth:
      username: "<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-db-user>"
      password: "<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-db-password>"
      database: "<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-db-name>"
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 17.6.0
  ingress:
    enabled: true
    ingressClassName: "nginx"
    hostname: "<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-host>"
    tls: true
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/enable-cors: 'true'
  apirule:
    enabled: false
  auth:
    adminUser: "<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-admin-user>"
    adminPassword: "<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-admin-password>"
  service:
    type: ClusterIP
  extraVolumes:
    - name: consumer-realm
      configMap:
        name: consumer-realm
  extraVolumeMounts:
    - mountPath: /opt/keycloak/data/import/consumer-realm.json
      subPath: consumer-realm.json
      name: consumer-realm

  command: ["/bin/sh", "-c"]
  args: ["/bin/sh -c 'kc.sh import --file /opt/keycloak/data/import/consumer-realm.json; kc.sh start-dev --hostname-strict=false --proxy-headers=xforwarded --http-enabled=true --features=token-exchange'"]

sts-chart:
  image:
    repository: ghcr.io/factory-x-contributions/mxport-leo-token-exchange
    tag: latest
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: basyx-leo-step3-consumer-ghcr-pull-secret

  ingress:
    enabled: true
    ingressClassName: "nginx"
    tls:
      - hosts:
          - "<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>"
        secretName: sts-consumer-tls
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: "<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>"
        paths:
          - path: /
            pathType: ImplementationSpecific

  serverConfig:
    issuer: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>/sts"
    issuerSpecificConfiguration:
      - issuer: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-host>/realms/<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-realm-name>"
        jwks:
          jwksType: "uri"
          jwksUri: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-host>/realms/<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-realm-name>/protocol/openid-connect/certs"

  filterConfig:
  - filterType: com.siemens.iam.exchange.sample.filter.FxFilter
    issuer: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-host>/realms/<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-realm-name>"
    audience: <path:factory-x-ci-cd/data/gateway-sts-provider#gateway-host>
    parameters:
        targetAudience:
          - "https://<path:factory-x-ci-cd/data/gateway-sts-provider#sts-host>/sts"
        targetIssuer: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>/sts"
  - filterType: com.siemens.iam.exchange.core.filter.ClaimsCopyFilter
    issuer: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-host>/realms/<path:factory-x-ci-cd/data/gateway-sts-consumer#keycloak-realm-name>"
    audience: <path:factory-x-ci-cd/data/gateway-sts-provider#gateway-host>
    parameters:
      claimsMap:
        jti: jti
        iat: iat
        exp: exp
        sub: sub
        client_id: client_id

gateway-sts:
  nameOverride: consumer-sts-api-gateway
  fullnameOverride: consumer-sts-api-gateway
  
  containerPort: 80

  image:
    repository: ghcr.io/factory-x-contributions/mxport-leo-gateway
    tag: openresty-sts-module
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: basyx-leo-step3-consumer-ghcr-pull-secret

  service:
    type: ClusterIP
    port: 80
  
  ingress:
    enabled: true
    ingressClassName: "nginx"
    tls:
      - hosts:
          - "<path:factory-x-ci-cd/data/gateway-sts-consumer#gateway-host>"
        secretName: gateway-consumer-tls
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: "<path:factory-x-ci-cd/data/gateway-sts-consumer#gateway-host>"
        paths:
          - path: /
            pathType: ImplementationSpecific

    volumes: []
    volumeMounts: []
