worker_processes 1;
events { worker_connections 1024; }

http {
  error_log /usr/local/openresty/nginx/logs/error.log info;

  # Shared cache for exchanged tokens (10 MB)
  lua_shared_dict sts_token_cache 10m;

  # Set TLS certificates
  lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  lua_ssl_verify_depth 3;

  # DNS resolver; required for dynamic proxy_pass
  resolver 8.8.8.8 valid=30s ipv6=off;

  # Strict allowlist of permitted downstream providers.
  init_by_lua_block {
    allowed_providers = {
      ["<path:factory-x-ci-cd/data/gateway-sts-provider#gateway-host>"] = true,
    }
  }

  server {
    listen 80;
    server_name <path:factory-x-ci-cd/data/gateway-sts-consumer#gateway-host>;
    location = /healthz { return 200 "OK\n"; }

    location ~ ^/external/(?<provider_host>[^/]+)(?<provider_path>/.*)$ {
      access_by_lua_block {
        local host = ngx.var.provider_host

        -- 1. Reject anything not on the exact-match allowlist.
        if not allowed_providers[host] then
          ngx.log(ngx.WARN, "blocked non-allowlisted provider: ", host)
          return ngx.exit(ngx.HTTP_FORBIDDEN)
        end

        -- 2. Mint the token only for the validated host.
        require("sts").exchange({
          sts_url        = "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>/sts/token",
          target_service = host,
        })
      }

      proxy_set_header Host $provider_host;
      proxy_pass https://$provider_host$provider_path;
    }
  }
}