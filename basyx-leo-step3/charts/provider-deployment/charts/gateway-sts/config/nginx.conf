# Load the STS dynamic module installed by the .deb
load_module modules/ngx_sts_module.so;

worker_processes  1;
events { worker_connections  1024; }

http {
  error_log /var/log/nginx/error.log debug;

  # Extract source bearer token
  map $http_authorization $source_token {
    default                            "";
    "~*^Bearer\\s+(?<token>[\\S]+)$"   $token;
  }

  server {
    listen 80;
    server_name <path:factory-x-ci-cd/data/gateway-sts-provider#gateway-host>;

    location = /healthz { return 200 "OK\n"; }

    # Reverse proxy with OAuth 2.0 Token Exchange
    location /api/ {

      error_page 418 = @api_passthrough;
      # No token present: forward request as-is, bypassing STS entirely
      if ($source_token = "") {
        return 418;
      }

      # Token exchange
      STSExchange otx https://<path:factory-x-ci-cd/data/gateway-sts-provider#sts-host>/sts/token
          auth=none&grant_type=urn:ietf:params:oauth:grant-type:token-exchange&params=subject_token_type=urn:ietf:params:oauth:token-type:jwt;

      # Provide subject token and receive target token
      STSVariables $source_token $target_token;

      # inject exchanged token
      proxy_set_header Authorization "Bearer $target_token";

      proxy_pass https://<path:factory-x-ci-cd/data/gateway-sts-provider#basyx-env-url>/;
    }

    # Internal passthrough location: plain proxy with no token exchange
    location @api_passthrough {
      proxy_set_header Authorization "";
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass https://<path:factory-x-ci-cd/data/gateway-sts-provider#basyx-env-url>;
    }
  }
}
