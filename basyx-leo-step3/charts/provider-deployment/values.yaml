global:
  security:
    allowInsecureImages: true # needed because bitnami is now in bitnamilegacy

gateway-sts:
  nameOverride: provider-sts-api-gateway
  fullnameOverride: provider-sts-api-gateway
  
  containerPort: 80

  image:
    repository: ghcr.io/factory-x-contributions/mxport-leo-gateway
    tag: latest
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: basyx-leo-step3-provider-ghcr-pull-secret

  service:
    type: ClusterIP
    port: 80
  
  ingress:
    enabled: true
    ingressClassName: "nginx"
    tls:
      - hosts:
          - "<path:factory-x-ci-cd/data/gateway-sts-provider#gateway-host>"
        secretName: gateway-provider-tls
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: "<path:factory-x-ci-cd/data/gateway-sts-provider#gateway-host>"
        paths:
          - path: /
            pathType: ImplementationSpecific

    volumes: []
    volumeMounts: []

aas-basyx-v2-full:
  mqtt:
    enabled: false

  mongodb:
    enabled: false

  keycloak:
    enabled: false

  aas-registry:
    enabled: true
    image:
      # If Kafka is used, then the appropriate Bootstrap connection string must be provided.
      name: eclipsebasyx/aas-registry-log-mem:2.0.0-SNAPSHOT
      pullPolicy: IfNotPresent
    service:
      port: 8080
    # Keep it null if not deploying a Kafka instance.
    kafka:
      connectionString: null
    ingress:
      enabled: true
      host: <path:factory-x-ci-cd/data/gateway-sts-provider#aas-registry-url>
      tls: true
      ingressClassName: "nginx"
      annotations:
        kubernetes.io/ingress.class: nginx
        cert-manager.io/cluster-issuer: letsencrypt-prod


  sm-registry:
    enabled: false

  aas-discovery:
    enabled: false

  # Also needs an ingress.
  aas-environment:
    enabled: true
    image:
      name: eclipsebasyx/aas-environment:2.0.0-SNAPSHOT
      pullPolicy: Always
    service:
      port: 8081
    ingress:
      enabled: true
      host: <path:factory-x-ci-cd/data/gateway-sts-provider#basyx-env-url>
      tls: true
      ingressClassName: "nginx"
      annotations:
        kubernetes.io/ingress.class: nginx
        cert-manager.io/cluster-issuer: letsencrypt-prod
    config: |-
      server.port=8081

      basyx.backend = InMemory

      #basyx.environment=file:aas

      logging.level.root=DEBUG

      basyx.cors.allowed-origins=*
      basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
      basyx.aasrepository.feature.registryintegration=https://<path:factory-x-ci-cd/data/gateway-sts-provider#aas-registry-url>
      basyx.externalurl=https://<path:factory-x-ci-cd/data/gateway-sts-provider#basyx-env-url>
      spring.servlet.multipart.max-file-size=128MB
      spring.servlet.multipart.max-request-size=128MB

      #basyx.aasrepository.feature.mqtt.enabled = true
      #basyx.submodelrepository.feature.mqtt.enabled = true
      #mqtt.clientId=basyx
      #mqtt.hostname=<path:factory-x-ci-cd/data/async-aas#broker-url>
      #mqtt.protocol=wss
      #mqtt.port=443
      #mqtt.username=<path:factory-x-ci-cd/data/async-aas#broker-user>
      #mqtt.password=<path:factory-x-ci-cd/data/async-aas#broker-pw>

      basyx.feature.authorization.enabled = true
      basyx.feature.authorization.type = rbac
      basyx.feature.authorization.jwtBearerTokenProvider = keycloak
      # basyx.feature.authorization.jwtBearerTokenProvider = sts  # maybe in the future
      basyx.feature.authorization.rbac.file = file:/application/rbac-rules.json

      spring.security.oauth2.resourceserver.jwt.issuer-uri = https://<path:factory-x-ci-cd/data/gateway-sts-provider#sts-host>/sts

      #spring.data.mongodb.uri=mongodb://mongodb
      #spring.data.mongodb.port=27017
      #spring.data.mongodb.database=factoryx-mongo-db
      #spring.data.mongodb.username=<path:factory-x-ci-cd/data/async-aas#mongodb-admin-user>
      #spring.data.mongodb.password=<path:factory-x-ci-cd/data/async-aas#mongodb-admin-pw>

    rbac:
      rules: |
        [
          {
            "role": "admin",
            "action": ["CREATE", "READ", "UPDATE", "DELETE" ],
            "targetInformation": {
              "@type": "concept-description",
              "conceptDescriptionIds": "*"
            }
          },
          {
            "role": "admin",
            "action": [ "CREATE", "READ", "UPDATE", "DELETE" ],
            "targetInformation": {
              "@type": "aas",
              "aasIds": "*"
            }
          },
          {
            "role": "admin",
            "action": [ "CREATE", "READ", "UPDATE", "DELETE", "EXECUTE" ],
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "*",
              "submodelElementIdShortPaths": "*"
            }
          },
          {
            "role": "admin",
            "action": [ "CREATE", "READ", "UPDATE", "DELETE" ],
            "targetInformation": {
              "@type": "aas-environment",
              "aasIds": "*",
              "submodelIds": "*"
            }
          },
          {
            "role": "basyx-reader",
            "action": "READ",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "*",
              "submodelElementIdShortPaths": "*"
            }
          },
          {
            "role": "basyx-reader-two",
            "action": "READ",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId",
              "submodelElementIdShortPaths": "*"
            }
          },
          {
            "role": "basyx-sme-reader",
            "action": "READ",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": [
                "specificSubmodelId",
                "testSMId1",
                "testSMId2"
              ],
              "submodelElementIdShortPaths": [
                "testSMEIdShortPath1",
                "smc2.specificSubmodelElementIdShort",
                "testSMEIdShortPath2"
              ]
            }
          },
          {
            "role": "basyx-sme-reader-two",
            "action": "READ",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId",
              "submodelElementIdShortPaths": "smc2.specificFileSubmodelElementIdShort"
            }
          },
          {
            "role": "basyx-updater",
            "action": "UPDATE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "*",
              "submodelElementIdShortPaths": "*"
            }
          },
          {
            "role": "basyx-updater-two",
            "action": "UPDATE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId",
              "submodelElementIdShortPaths": "*"
            }
          },
          {
            "role": "basyx-sme-updater",
            "action": "UPDATE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId",
              "submodelElementIdShortPaths": "smc2.specificFileSubmodelElementIdShort"
            }
          },
          {
            "role": "basyx-sme-updater-two",
            "action": "UPDATE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId",
              "submodelElementIdShortPaths": "smc2"
            }
          },
          {
            "role": "basyx-sme-updater-three",
            "action": "UPDATE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId-2",
              "submodelElementIdShortPaths": "smc1.specificSubmodelElementIdShort-2"
            }
          },
          {
            "role": "basyx-file-sme-updater",
            "action": "UPDATE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId-2",
              "submodelElementIdShortPaths": "smc2.specificFileSubmodelElementIdShort"
            }
          },
          {
            "role": "basyx-deleter",
            "action": "DELETE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "*",
              "submodelElementIdShortPaths": "*"
            }
          },
          {
            "role": "basyx-deleter-two",
            "action": "DELETE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId-2",
              "submodelElementIdShortPaths": "*"
            }
          },
          {
            "role": "basyx-executor",
            "action": "EXECUTE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "*",
              "submodelElementIdShortPaths": "*"
            }
          },
          {
            "role": "basyx-executor-two",
            "action": "EXECUTE",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId",
              "submodelElementIdShortPaths": "square"
            }
          },
          {
            "role": "basyx-file-sme-reader",
            "action": "READ",
            "targetInformation": {
              "@type": "submodel",
              "submodelIds": "specificSubmodelId-2",
              "submodelElementIdShortPaths": "smc2.specificFileSubmodelElementIdShort"
            }
          }
        ]
  
  # Needs specific ingress.
  aas-web-ui:
    enabled: false

sts-chart:
  image:
    repository: ghcr.io/factory-x-contributions/mxport-leo-token-exchange
    tag: latest
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: basyx-leo-step3-provider-ghcr-pull-secret

  ingress:
    enabled: true
    ingressClassName: "nginx"
    tls:
      - hosts:
          - "<path:factory-x-ci-cd/data/gateway-sts-provider#sts-host>"
        secretName: sts-provider-tls
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: "<path:factory-x-ci-cd/data/gateway-sts-provider#sts-host>"
        paths:
          - path: /
            pathType: ImplementationSpecific

  trustlist:
    enabled: true

  serverConfig:
    issuer: "https://<path:factory-x-ci-cd/data/gateway-sts-provider#sts-host>/sts"
    keystore:
      keystorePassword: "<path:factory-x-ci-cd/data/gateway-sts-provider#keystore-password>"
      keyPassword: "<path:factory-x-ci-cd/data/gateway-sts-provider#key-password>"
    issuerSpecificConfiguration:
      - issuer: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>/sts"
        jwks:
          jwksType: "uri"
          jwksUri: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>/sts/jwks"

  filterConfig:
  - filterType: com.siemens.iam.exchange.core.filter.ClaimsCopyFilter
    issuer: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>/sts"
    parameters:
      claimsMap:
        jti: jti
        iat: iat
        exp: exp
        sub: sub
  - filterType: com.siemens.iam.exchange.sample.filter.BasyxFilter
    issuer: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>/sts"
    parameters:
      targetAudience: "basyx-client-api"
  - filterType: com.siemens.iam.exchange.core.filter.ClaimsAppenderFilter
    issuer: "https://<path:factory-x-ci-cd/data/gateway-sts-consumer#sts-host>/sts"
    parameters:
        claimsMap:
         iss: "https://<path:factory-x-ci-cd/data/gateway-sts-provider#sts-host>/sts"
