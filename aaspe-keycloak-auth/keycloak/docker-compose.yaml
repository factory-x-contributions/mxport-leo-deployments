version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KC_VERSION}
    container_name: keycloak
    command: start-dev
    restart: unless-stopped

    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

    ports:
      - "8080:8080"

    networks:
      - blueprint-net

networks:
  blueprint-net:
    external: true